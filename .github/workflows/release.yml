# This action will publish the package to npm and create a GitHub release.
name: Release

on:
  # Run `npm run bump` to bump the version and create a git tag.
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, v19.2.0)
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Resolve Release Tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9] ]] || ! git check-ref-format "refs/tags/$tag"; then
            echo "Invalid release tag: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}

      - name: Verify Release Version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            if (process.env.RELEASE_TAG !== `v${version}`) {
              throw new Error(`Release tag ${process.env.RELEASE_TAG} does not match package version ${version}`);
            }
          '

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.20.0
          package-manager-cache: false

      # Pin Node-compatible versions; npm >=11.5.1 supports OIDC publishing.
      - name: Setup Package Managers
        run: |
          npm install -g npm@11.19.0
          npm --version
          npm install -g corepack@0.34.6 --force
          corepack enable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          provenance: true

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.release.outputs.tag }}
          generateReleaseNotes: "true"
          skipIfReleaseExists: "true"
